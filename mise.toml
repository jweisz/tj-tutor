[tools]
python = "3.11"

[tasks.start-ollama]
run = "uv run main.py"
description = "Run recipe using Ollama backend"

[tasks.start-anthropic]
run = "uv run main.py --provider anthropic"
description = "Run recipe using Anthropic backend"

[tasks.lint]
description = "Run lint checks"
run = "uv run ruff check ."

[tasks.lint-fix]
description = "Run lint auto-fixes"
run = "uv run ruff check . --fix"

[tasks.format]
description = "Format code"
run = "uv run ruff format ."

[tasks.format-check]
description = "Check code formatting"
run = "uv run ruff format . --check"

[tasks.typecheck]
description = "Run static type checking"
run = "uv run mypy ."
