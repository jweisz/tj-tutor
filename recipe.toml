# Recipe-specific configuration

[tutor]
lesson_path = "lessons/space_basics.yaml"

# This recipe can run using two user interfaces:
# 1. "console" runs the entire experience through this terminal, where the user
# types in their input and the system prints the responses to the console.
# This mode is useful when debugging a lesson and it can run on your computer, no
# TJBot required.
# 2. "tjbot" uses the TJBot API to speak, listen, wave, and shine. This mode must
# be run on a TJBot.
# By default, we specify the "tjbot" interface here so that `mise run start` 
# runs the recipe for your TJBot. You can switch the interface to "console" here,
# or you can use the override `mise run start-console`.
interface = "tjbot"

# Seconds of LLM inference before TJBot says "give me a moment, I'm thinking..."
thinking_delay_secs = 3.0

# Seconds of microphone silence before giving up and re-prompting the student
# (TJBot interface only; console interface ignores this)
listen_reprompt_secs = 5.0

[tutor.llm]
#provider = "ollama"                     # "anthropic" | "ollama"
provider = "anthropic"

# These parameters are used when provider = "ollama"
ollama_model = "granite4.1:3b"          # we also recomend trying "gemma4:e2b"
ollama_host = "http://localhost:11434"  # URL to your ollama instance

# These parameters are used when provider = "anthropic"
anthropic_model = "claude-sonnet-4-6"   # we also recommend trying "claude-opus-4-7"
anthropic_effort = "low"                # "low" | "medium" | "high"
